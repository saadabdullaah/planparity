name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and verify frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test:run
          npm run build
      - name: Verify backend
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
          go test -race ./...
      - name: Build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_version="${VERSION#v}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          commit="$(git rev-parse --short HEAD)"
          ldflags="-s -w -X github.com/saadabdullaah/planparity/internal/buildinfo.version=${VERSION} -X github.com/saadabdullaah/planparity/internal/buildinfo.commit=${commit} -X github.com/saadabdullaah/planparity/internal/buildinfo.date=${build_date}"
          mkdir -p dist/stage

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/stage/planparity.exe ./cmd/planparity
          cp README.md LICENSE CHANGELOG.md SECURITY.md dist/stage/
          (cd dist/stage && zip -q -r "../planparity_${release_version}_windows_amd64.zip" .)

          rm -rf dist/stage
          mkdir -p dist/stage
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$ldflags" -o dist/stage/planparity ./cmd/planparity
          cp README.md LICENSE CHANGELOG.md SECURITY.md dist/stage/
          tar -C dist/stage -czf "dist/planparity_${release_version}_linux_amd64.tar.gz" .

          rm -rf dist/stage
          mkdir -p dist/stage
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$ldflags" -o dist/stage/planparity ./cmd/planparity
          cp README.md LICENSE CHANGELOG.md SECURITY.md dist/stage/
          tar -C dist/stage -czf "dist/planparity_${release_version}_linux_arm64.tar.gz" .

          rm -rf dist/stage
          (cd dist && sha256sum planparity_* > checksums.txt)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/planparity_*.zip
            dist/planparity_*.tar.gz
            dist/checksums.txt
